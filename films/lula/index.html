<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lula: acusações e desfechos</title>
<style>
  @font-face { font-family: Display; font-weight: 900; src: url(/node_modules/@fontsource/archivo/files/archivo-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: Display; font-weight: 700; src: url(/node_modules/@fontsource/archivo/files/archivo-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: UI; font-weight: 500; src: url(/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: UI; font-weight: 700; src: url(/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
  body.preview { display: grid; place-items: center; height: 100vh; gap: 8px; align-content: center; }
  .scrub { width: 60vw; }
</style>
</head>
<body>
<script type="module">
import { mount, loadFonts, range, ease, lerp, rand } from '/lib/studio.js';
import { SEGMENTS, PLACAR, FONTES, DURATION } from './timeline.js';

// Ink ground, bone type, one amber accent (also the halftone ink), grey for secondary text.
const BG = '#0F1011', FG = '#ECE8DF', ACC = '#F2A541', DIM = '#8E8B84';
const PAPER = '#EFE8D8', INKP = '#17150F', PAPER_DIM = '#6E675B';
const D = (w, px) => `${w} ${px}px Display`;
const U = (w, px) => `${w} ${px}px UI`;
const X = 70;
const IMGS = ['stf', 'mala', 'montadora', 'plataforma', 'caca', 'obra', 'triplex', 'sitio', 'terreno', 'telefone', 'mensagens', 'inss', 'congresso'];
const SRC = {}; // name -> { w, h, lum: Float32Array }

mount({
  width: 1080, height: 1920, fps: 30, duration: DURATION,

  async setup() {
    await loadFonts([D(900, 100), D(700, 100), U(500, 40), U(700, 40)]);
    // Canva illustrations arrive as 112x199 previews: sample their luminance once and
    // redraw them as a crisp halftone screen, which suits that resolution.
    await Promise.all(IMGS.map(async (n) => {
      const im = new Image();
      im.src = `img/${n}.jpg`;
      await im.decode();
      const c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      const g = c.getContext('2d');
      g.drawImage(im, 0, 0);
      const px = g.getImageData(0, 0, c.width, c.height).data;
      const lum = new Float32Array(c.width * c.height);
      for (let i = 0; i < lum.length; i++) lum[i] = (0.3 * px[i * 4] + 0.59 * px[i * 4 + 1] + 0.11 * px[i * 4 + 2]) / 255;
      SRC[n] = { w: c.width, h: c.height, lum };
    }));
  },

  draw(env, t) {
    const { ctx, beats, W, H } = env;
    const b = (n) => beats.at(Math.floor(n)) + (n - Math.floor(n)) * (60 / beats.tempo);
    const pulse = beats.pulse(t, 0.22);
    const R = W - X;

    // ---------- helpers ----------
    const fitPx = (str, font, px, maxW) => {
      ctx.font = font(px);
      const w = ctx.measureText(str).width;
      return w > maxW ? Math.floor(px * maxW / w) : px;
    };
    const rise = (str, x, y, size, p, font = (s) => D(900, s), color = FG, maxW = R - x) => {
      if (p <= 0) return;
      const s = fitPx(str, font, size, maxW);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, y - s * 1.02, W, s * 1.3); ctx.clip();
      ctx.font = font(s); ctx.fillStyle = color; ctx.textBaseline = 'alphabetic';
      ctx.fillText(str, x, y + (1 - p) * s * 1.25);
      ctx.restore();
    };
    const wrap = (str, font, maxW) => {
      ctx.font = font;
      const out = []; let line = '';
      for (const w of str.split(' ')) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
      }
      if (line) out.push(line);
      return out;
    };
    const para = (str, x, y, size, t0, { w = 700, color = FG, lh = 1.24, maxW = R - x } = {}) => {
      const lines = wrap(str, D(w, size), maxW);
      lines.forEach((ln, i) => rise(ln, x, y + i * size * lh, size, ease.outQuart(range(t, t0 + i * 0.06, t0 + i * 0.06 + 0.45)), (s) => D(w, s), color));
      return lines.length;
    };
    const p = (n, d = 0.45) => ease.outQuart(range(t, b(n), b(n) + d));

    // Halftone screen of an illustration into a rect. zoom/pan drift with time; rows reveal
    // top-down from t0 (dots grow from nothing, no opacity fades).
    const halftone = (name, rx, ry, rw, rh, { t0 = -1, zoom = 1, focus = 0.5, cell = 10, color = ACC, reveal = 0.5 } = {}) => {
      const s = SRC[name]; if (!s) return;
      const k = Math.max(rw / s.w, rh / s.h) * zoom;
      const ox = rx + (rw - s.w * k) / 2, oy = ry + (rh - s.h * k) * focus;
      ctx.save(); ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip();
      ctx.fillStyle = color; ctx.beginPath();
      const rows = Math.ceil(rh / cell), cols = Math.ceil(rw / cell);
      for (let r = 0; r < rows; r++) {
        const pr = t0 < 0 ? 1 : ease.outCubic(range(t, t0 + (r / rows) * reveal, t0 + (r / rows) * reveal + 0.25));
        if (pr <= 0) continue;
        const py = ry + (r + 0.5) * cell;
        for (let c = 0; c < cols; c++) {
          const px = rx + (c + 0.5) * cell + (r % 2 ? cell / 2 : 0);
          const u = (px - ox) / k - 0.5, v = (py - oy) / k - 0.5;
          const i = Math.max(0, Math.min(s.w - 2, Math.floor(u))), j = Math.max(0, Math.min(s.h - 2, Math.floor(v)));
          const fu = Math.max(0, Math.min(1, u - i)), fv = Math.max(0, Math.min(1, v - j));
          const L = s.lum, w = s.w;
          const l = (L[j * w + i] * (1 - fu) + L[j * w + i + 1] * fu) * (1 - fv) + (L[(j + 1) * w + i] * (1 - fu) + L[(j + 1) * w + i + 1] * fu) * fv;
          const rad = cell * 0.62 * Math.sqrt(Math.min(1, l * 1.25)) * pr;
          if (rad < 0.6) continue;
          ctx.moveTo(px + rad, py); ctx.arc(px, py, rad, 0, Math.PI * 2);
        }
      }
      ctx.fill(); ctx.restore();
    };

    // A newspaper clipping: paper card with a torn bottom edge, outlet + year, quoted headline.
    const clipping = (c, seed, enter, exit, cy) => {
      if (enter <= 0 || exit >= 1) return;
      const cw = 880, pad = 40;
      const lines = wrap(c.headline, D(700, 54), cw - pad * 2);
      const ch = pad + 44 + lines.length * 64 + pad - 6;
      const rot = (seed % 2 ? 1.6 : -1.8) * Math.PI / 180;
      const x = lerp(W + 200, (W - cw) / 2, ease.outExpo(enter)) - ease.inExpo(exit) * (W + 300);
      const y = cy - ch / 2;
      ctx.save();
      ctx.translate(x + cw / 2, y + ch / 2);
      ctx.rotate(rot + (1 - ease.outExpo(enter)) * 0.12);
      ctx.translate(-cw / 2, -ch / 2);
      const torn = () => {
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(cw, 0); ctx.lineTo(cw, ch);
        for (let xx = cw; xx > 0; xx -= 22) ctx.lineTo(xx - 11, ch - 6 - rand(seed, xx) * 12), ctx.lineTo(Math.max(0, xx - 22), ch);
        ctx.closePath();
      };
      ctx.save(); ctx.translate(14, 16); torn(); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill(); ctx.restore();
      torn(); ctx.fillStyle = PAPER; ctx.fill();
      ctx.fillStyle = INKP; ctx.fillRect(pad, pad + 40, 60, 5);
      ctx.font = U(700, 32); ctx.fillStyle = PAPER_DIM; ctx.textBaseline = 'alphabetic';
      ctx.fillText((c.outlet + (c.year ? ' · ' + c.year : '')).toUpperCase(), pad, pad + 26);
      ctx.font = D(700, 54); ctx.fillStyle = INKP;
      // hanging opening quote on the first line, closing quote on the last
      lines.forEach((ln, i) => ctx.fillText((i === 0 ? '“' : '') + ln + (i === lines.length - 1 ? '”' : ''), pad - (i === 0 ? 22 : 0), pad + 44 + 52 + i * 64));
      ctx.restore();
    };

    const stamp = (label, tIn, cy) => {
      const k = ease.outExpo(range(t, tIn, tIn + 0.22));
      if (k <= 0) return;
      const sc = lerp(1.7, 1, k);
      const size = fitPx(label, (s) => D(900, s), 96, W - 2 * X - 80);
      ctx.font = D(900, size);
      const tw = ctx.measureText(label).width;
      const bw = tw + 70, bh = size + 50;
      ctx.save();
      ctx.translate(X + bw / 2, cy); ctx.rotate(-2.5 * Math.PI / 180); ctx.scale(sc, sc);
      ctx.strokeStyle = ACC; ctx.lineWidth = 8; ctx.strokeRect(-bw / 2, -bh / 2, bw, bh);
      ctx.fillStyle = ACC; ctx.textBaseline = 'middle'; ctx.fillText(label, -tw / 2, 4);
      ctx.restore();
    };

    // ---------- background ----------
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    const seg = SEGMENTS.find((s) => t >= b(s.start) && t < b(s.end)) ?? SEGMENTS[SEGMENTS.length - 1];
    const T0 = b(seg.start), T1 = b(seg.end);
    const local = (t - T0) / (T1 - T0);

    // ================= intro =================
    if (seg.type === 'intro') {
      halftone(seg.img, 0, 0, W, H, { t0: T0, zoom: 1.02 + 0.08 * local, focus: 0.35, cell: 11, reveal: 0.6 });
      const panel = ease.outExpo(range(t, b(0.6), b(0.6) + 0.5));
      ctx.fillStyle = BG; ctx.fillRect(0, lerp(H, 1080, panel), W, H);
      const s = fitPx('LULA', (q) => D(900, q), 420, R - X);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 1080, W, 400); ctx.clip();
      ctx.font = D(900, s * (1 + 0.02 * pulse)); ctx.fillStyle = FG;
      ctx.fillText('LULA', X, 1410 + (1 - ease.outExpo(range(t, b(1), b(1) + 0.35))) * 420);
      ctx.restore();
      rise('Acusações, processos e desfechos', X, 1520, 64, p(3), (q) => D(700, q));
      rise('2003 — 2026', X, 1610, 56, p(4.5), (q) => U(700, q), ACC);
      rise('Acusação não é condenação.', X, 1745, 58, p(8), (q) => D(900, q));
      rise('Anulação não é absolvição.', X, 1830, 58, p(10), (q) => D(900, q), ACC);
    }

    // ================= chapter card =================
    if (seg.type === 'chapter') {
      const hasImg = !!seg.img;
      if (hasImg) halftone(seg.img, 0, 0, W, 820, { t0: T0, zoom: 1 + 0.06 * local, focus: 0.55 });
      const yBig = hasImg ? 1180 : 960;
      const s = fitPx(seg.big, (q) => D(900, q), hasImg ? 300 : 520, R - X);
      ctx.save(); ctx.beginPath(); ctx.rect(0, yBig - s * 0.8, W, s * 0.85); ctx.clip();
      ctx.font = D(900, s); ctx.fillStyle = FG;
      ctx.fillText(seg.big, X, yBig - (1 - ease.outExpo(range(t, T0, T0 + 0.3))) * s);
      ctx.restore();
      rise(seg.label, X, yBig + 140, 130, p(seg.start + 1));
      rise(seg.years, X, yBig + 240, 72, p(seg.start + 2), (q) => U(700, q), ACC);
      const bar = ease.inOutCubic(range(t, b(seg.start + 2.5), b(seg.start + 2.5) + 0.5));
      ctx.fillStyle = ACC; ctx.fillRect(X, yBig + 290, (R - X) * bar, 10);
      if (seg.line) para(seg.line, X, yBig + 420, 56, b(seg.start + 4), { color: FG });
      // 2003-2026 ruler: where this chapter sits in Lula's public life
      if (!hasImg) {
        const span = { '1º': [2003, 2007], '2º': [2007, 2011], '3º': [2023, 2026.8] }[seg.big];
        const yx = (y) => lerp(X, R, (y - 2003) / (2027 - 2003));
        const ry = 430, grow = ease.inOutCubic(range(t, T0, T0 + 0.6));
        ctx.fillStyle = DIM; ctx.fillRect(X, ry - 2, (R - X) * grow, 4);
        for (let y = 2003; y <= 2027; y++) {
          if (yx(y) > X + (R - X) * grow) break;
          const major = y % 4 === 3 || y === 2003;
          ctx.fillRect(yx(y) - 2, ry - (major ? 26 : 12), 4, major ? 52 : 24);
        }
        if (span) {
          const k = ease.outExpo(range(t, b(seg.start + 1.5), b(seg.start + 1.5) + 0.5));
          ctx.fillStyle = ACC;
          ctx.fillRect(yx(span[0]), ry - 40, (yx(span[1]) - yx(span[0])) * k, 80);
        }
        ctx.font = U(500, 36); ctx.fillStyle = DIM;
        ctx.fillText('2003', X, ry + 90);
        const w = ctx.measureText('2026').width; ctx.fillText('2026', R - w, ry + 90);
        rise('Lula na vida pública', X, ry - 110, 44, p(seg.start + 0.4), (q) => D(700, q), DIM);
      }
    }

    // ================= case =================
    if (seg.type === 'case') {
      const st = seg.start;
      // image (optionally switches to a second one mid-segment, row by row)
      halftone(seg.img, 0, 0, W, 900, { t0: T0, zoom: 1.02 + 0.1 * local, focus: seg.focus });
      if (seg.img2 && t >= b(st + seg.img2.at)) {
        ctx.fillStyle = BG;
        const k = ease.inOutCubic(range(t, b(st + seg.img2.at), b(st + seg.img2.at) + 0.5));
        ctx.fillRect(0, 0, W, 900 * k);
        halftone(seg.img2.img, 0, 0, W, 900, { t0: b(st + seg.img2.at), zoom: 1.02 + 0.05 * local, focus: 0.5 });
      }
      // kicker + title
      rise(seg.kicker, X, 990, 40, p(st + 0.3), (q) => U(700, q), ACC);
      rise(seg.title, X, 1110, 104, p(st + 0.6));
      // paragraphs: each new one pushes the previous out upward
      const P0 = 1200, PS = 52;
      ctx.save(); ctx.beginPath(); ctx.rect(0, P0 - PS, W, 360); ctx.clip();
      seg.paras.forEach((pa, i) => {
        const tIn = b(st + pa.at);
        if (t < tIn) return;
        const next = seg.paras[i + 1];
        const out = next ? ease.inExpo(range(t, b(st + next.at) - 0.05, b(st + next.at) + 0.2)) : 0;
        if (out >= 1) return;
        ctx.save(); ctx.translate(0, -out * 360);
        para(pa.text, X, P0, PS, tIn);
        ctx.restore();
      });
      ctx.restore();
      // clippings over the lower part of the image
      seg.clips.forEach((c, i) => {
        const tIn = b(st + c.at);
        const next = seg.clips[i + 1];
        const tOut = next ? b(st + next.at) - 0.15 : T1 - 0.35;
        clipping(c, i + st, range(t, tIn, tIn + 0.5), range(t, tOut, tOut + 0.3), 690);
      });
      // verdict stamps: the newest is big, earlier ones become struck-through chips
      const done = seg.stamps.filter((s) => t >= b(st + s.at));
      if (done.length) {
        const cur = done[done.length - 1];
        if (done.length > 1) {
          let x = X;
          ctx.font = U(700, 34);
          done.slice(0, -1).forEach((s) => {
            const w = ctx.measureText(s.label).width;
            ctx.fillStyle = DIM; ctx.fillText(s.label, x, 1600);
            ctx.fillRect(x - 4, 1588, w + 8, 4);
            x += w + 40;
          });
        }
        stamp(cur.label, b(st + cur.at), 1700);
        rise(cur.note, X, 1850, 38, p(st + cur.at + 1, 0.35), (q) => U(500, q), DIM);
      }
    }

    // ================= scoreboard =================
    if (seg.type === 'placar') {
      const st = seg.start;
      rise('O placar', X, 250, 150, p(st));
      rise('Situação de cada caso em outubro de 2026', X, 330, 44, p(st + 0.6), (q) => D(700, q), DIM);
      PLACAR.forEach(([name, v], i) => {
        const y = 450 + i * 92;
        if (t < b(st + 2 + i)) return;
        rise(name, X, y, 46, p(st + 2 + i, 0.35), (q) => D(700, q), FG, 560);
        ctx.font = U(700, 36);
        const vw = Math.min(ctx.measureText(v).width, 440);
        rise(v, R - vw, y, 36, p(st + 2.2 + i, 0.35), (q) => U(700, q), ACC, 440);
        ctx.fillStyle = '#2A2B2C'; ctx.fillRect(X, y + 26, (R - X) * ease.outCubic(range(t, b(st + 2 + i), b(st + 2 + i) + 0.4)), 2);
      });
      const n1 = para('Nenhuma condenação de Lula está em vigor hoje.', X, 1530, 68, b(st + 15), { w: 900 });
      para('As do triplex e do sítio foram anuladas por razões processuais, sem julgamento do mérito.', X, 1530 + n1 * 84 + 30, 46, b(st + 19), { color: DIM });
    }

    // ================= sources =================
    if (seg.type === 'fontes') {
      const st = seg.start;
      rise('Fontes', X, 640, 140, p(st));
      let y = 790;
      FONTES.forEach((f, i) => {
        const n = wrap(f, D(700, 48), R - X).length;
        para(f, X, y, 48, b(st + 1 + i * 0.5), { w: 700 });
        y += n * 60 + 26;
      });
      para('Manchetes citadas como foram publicadas. Ilustrações geradas no Canva, sem fotos reais.', X, y + 120, 44, b(st + 4), { color: DIM });
    }
  },
});
</script>
</body>
</html>
